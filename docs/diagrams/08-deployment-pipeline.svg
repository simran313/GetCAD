<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" width="1040" height="380" font-family="Geist, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Delivery pipeline">
<title>Delivery pipeline</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<polyline points="170,102 210,102" fill="none" stroke="#404040" stroke-width="1.4"  marker-end="url(#arr)"/>
<polyline points="360,102 400,62" fill="none" stroke="#404040" stroke-width="1.4"  marker-end="url(#arr)"/>
<polyline points="360,102 400,142" fill="none" stroke="#404040" stroke-width="1.4"  marker-end="url(#arr)"/>
<polyline points="285,134 380,228 400,228" fill="none" stroke="#404040" stroke-width="1.4"  marker-end="url(#arr)"/>
