name: CI

# Runs on every PR (and on pushes to the trunk). Target: under 5 minutes.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Throwaway Postgres for the DB tests (Tests B, C, D). Behaves like Supabase
    # for these checks; the live Supabase project is never touched by CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Order: type-check -> lint (incl. boundary rule) -> tests -> secret-scan.
      - name: Type-check (tsc strict)
        run: npm run typecheck

      - name: Lint (includes core/ boundary rule)
        run: npm run lint

      # The DB tests raise errors on purpose (refusals are what they test), and
      # Postgres logs each one; that log is printed after the job and pushes the
      # test output out of view. Log only what is actually broken.
      - name: Quiet the expected database errors
        run: |
          psql "$DATABASE_URL" -c "ALTER SYSTEM SET log_min_messages = 'fatal'" \
                               -c "ALTER SYSTEM SET log_min_error_statement = 'panic'" \
                               -c "SELECT pg_reload_conf()"

      - name: Tests (vitest — boundary + schema/RLS)
        run: npm run test

      - name: Secret scan
        run: npm run secret-scan

  # Phase 8: the journeys in a real browser against a real build. Separate
  # from verify so the 5-minute check stays fast. Sign-in uses the Clerk
  # DEVELOPMENT instance (repository secrets E2E_CLERK_PUBLISHABLE_KEY and
  # E2E_CLERK_SECRET_KEY); the database, PostgREST and file store are
  # throwaway, here in the runner.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Clerk test keys are set
        run: |
          if [ -z "$CLERK_SECRET_KEY" ] || [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::Add the repository secrets E2E_CLERK_PUBLISHABLE_KEY and E2E_CLERK_SECRET_KEY (Clerk development instance). See tests/e2e/README.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Quiet the expected database errors
        run: |
          psql "$DATABASE_URL" -c "ALTER SYSTEM SET log_min_messages = 'fatal'" \
                               -c "ALTER SYSTEM SET log_min_error_statement = 'panic'" \
                               -c "SELECT pg_reload_conf()"

      - name: Prepare the database, keys and Clerk test users
        run: npm run e2e:prepare

      - name: Start PostgREST
        run: npm run e2e:postgrest

      - name: Build the app against the test stack
        run: npm run e2e:build

      - name: Run the journeys
        run: npm run e2e:test

      - name: PostgREST log
        if: failure()
        run: docker logs getcad-e2e-postgrest 2>&1 | tail -100

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
