name: Marketing shots

# Screenshots and documents for the marketing work (owner, 2 Nov 2026):
# tests/marketing-shots makes a demo jeweler's orders through the real
# screens on the throwaway e2e stack, captures each screen at 390 and 1440,
# downloads the delivered order's documents, and the results are committed
# to marketing-shots/ on this branch. Never touches production.
on:
  push:
    branches: [marketing-shots]
  workflow_dispatch:

jobs:
  shots:
    # The commit this job pushes back carries [shots]; it does not run again.
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[shots]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Quiet the expected database errors
        run: |
          psql "$DATABASE_URL" -c "ALTER SYSTEM SET log_min_messages = 'fatal'" \
                               -c "ALTER SYSTEM SET log_min_error_statement = 'panic'" \
                               -c "SELECT pg_reload_conf()"

      - run: npm run e2e:prepare
      - run: npm run e2e:postgrest
      - run: npm run e2e:build

      - name: Make the demo orders and capture the screens
        id: shots
        run: npx playwright test -c playwright.marketing.config.ts
        continue-on-error: true

      - name: Keep the failure trace
        if: steps.shots.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: marketing-shots-trace
          path: test-results/
          retention-days: 7

      - name: Commit the shots to this branch
        run: |
          git config user.name "marketing-shots"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing-shots
          git commit -qm "marketing-shots: captured @ ${GITHUB_SHA::7} [shots]" || { echo "no changes"; exit 0; }
          git push -q origin HEAD:${GITHUB_REF_NAME}

      - name: Fail if the capture failed
        if: steps.shots.outcome != 'success'
        run: exit 1
